name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/stzk/nextblog
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build --force-recreate
            docker run --rm --network nextblog_app-network --env-file .env -v $(pwd):/app -w /app node:22-alpine sh -c "npm install -g pnpm@9 && pnpm install && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts"
            docker image prune -f
