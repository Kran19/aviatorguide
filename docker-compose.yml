services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isports_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-isports_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isports_user} -d ${POSTGRES_DB:-isports_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-isports_user}:${POSTGRES_PASSWORD:-isports_secure_pass}@db:5432/${POSTGRES_DB:-isports_db}?schema=public
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://aviatorgameguide.com}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://aviatorgameguide.com}
      - AUTH_URL=${AUTH_URL:-https://aviatorgameguide.com}
      - AUTH_SECRET=${AUTH_SECRET:-super-secret-production-auth-key-change-me}
      - AUTH_TRUST_HOST=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - uploads_data:/app/public/uploads

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
