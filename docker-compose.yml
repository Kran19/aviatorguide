version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: betsetgo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betsetgo_password}
      POSTGRES_DB: betsetgo_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://betsetgo_user:${POSTGRES_PASSWORD:-betsetgo_password}@db:5432/betsetgo_db?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET:-your-super-secret-key-change-in-production}
      - AUTH_TRUST_HOST=true
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - uploads_data:/app/public/uploads

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:
