    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">NextBlog Official Insight</text>
    <text x="0" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">In-depth guides, strategy breakdowns &amp; industry analysis</text>
