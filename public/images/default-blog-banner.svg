  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="300" fill="#10b981" opacity="0.1" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="250" fill="#06b6d4" opacity="0.1" filter="blur(60px)"/>
  <g transform="translate(100, 220)">
